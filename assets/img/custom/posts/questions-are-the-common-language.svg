<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 648" width="940" height="648" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Category playbooks pose questions; the questions map many-to-many onto a shared query library. One question usually needs several queries, one query serves several questions and playbooks, and a question with no query behind it is a gap worth filling.">
  <rect x="0" y="0" width="940" height="648" fill="#fbfcfd"/>

  <text x="30" y="42" font-size="20" font-weight="600" fill="#111827">The question is the common language</text>
  <text x="30" y="66" font-size="14" fill="#5b6673">Playbooks sit at category level; the mapping to queries is many-to-many, never one-to-one</text>

  <text x="30" y="92" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.5">PLAYBOOKS (CATEGORY)</text>
  <text x="276" y="92" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.5">QUESTIONS</text>
  <text x="640" y="92" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.5">SHARED QUERY LIBRARY</text>

  <g fill="none" stroke-width="1.6" opacity="0.85">
    <path d="M 210 176 C 242 176, 244 143, 276 143" stroke="#1e4c7c"/>
    <path d="M 210 176 C 242 176, 244 215, 276 215" stroke="#1e4c7c"/>
    <path d="M 210 176 C 246 176, 246 287, 276 287" stroke="#1e4c7c"/>
    <path d="M 210 176 C 250 176, 250 359, 276 359" stroke="#1e4c7c"/>

    <path d="M 210 420 C 246 420, 246 143, 276 143" stroke="#b45309" stroke-dasharray="5 4"/>
    <path d="M 210 420 C 250 420, 250 287, 276 287" stroke="#b45309" stroke-dasharray="5 4"/>
    <path d="M 210 420 C 242 420, 244 431, 276 431" stroke="#b45309" stroke-dasharray="5 4"/>
    <path d="M 210 420 C 242 420, 244 503, 276 503" stroke="#b45309" stroke-dasharray="5 4"/>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="1.6" opacity="0.9">
    <path d="M 530 143 C 580 143, 596 124, 640 124"/>
    <path d="M 530 143 C 580 143, 596 182, 640 182"/>
    <path d="M 530 143 C 584 143, 598 240, 640 240"/>
    <path d="M 530 215 C 580 215, 596 298, 640 298"/>
    <path d="M 530 287 C 580 287, 596 356, 640 356"/>
    <path d="M 530 287 C 584 287, 598 414, 640 414"/>
    <path d="M 530 359 C 580 359, 596 298, 640 298"/>
    <path d="M 530 359 C 584 359, 598 414, 640 414"/>
    <path d="M 530 431 C 580 431, 596 472, 640 472"/>
  </g>
  <path d="M 530 503 C 570 503, 590 530, 632 530" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4"/>

  <rect x="30" y="148" width="180" height="56" rx="10" fill="#e9f1f9" stroke="#1e4c7c" stroke-width="1.6"/>
  <text x="48" y="182" font-size="15" font-weight="600" fill="#1e4c7c">Malware</text>

  <rect x="30" y="392" width="180" height="56" rx="10" fill="#fdf3e4" stroke="#b45309" stroke-width="1.6"/>
  <text x="48" y="426" font-size="15" font-weight="600" fill="#b45309">Host compromise</text>

  <rect x="30" y="500" width="180" height="62" rx="10" fill="#f4f5f7" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="48" y="524" font-size="12.5" fill="#64748b">Credential misuse</text>
  <text x="48" y="546" font-size="12.5" fill="#64748b">Data exfiltration, DDoS</text>

  <g>
    <rect x="276" y="118" width="254" height="50" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="292" y="148" font-size="13" fill="#134e4a">How did this activity begin?</text>

    <rect x="276" y="190" width="254" height="50" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="292" y="220" font-size="13" fill="#134e4a">Is this normal for this host?</text>

    <rect x="276" y="262" width="254" height="50" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="292" y="292" font-size="13" fill="#134e4a">What did it connect to?</text>

    <rect x="276" y="334" width="254" height="50" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="292" y="364" font-size="13" fill="#134e4a">Has this appeared elsewhere?</text>

    <rect x="276" y="406" width="254" height="50" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="292" y="436" font-size="13" fill="#134e4a">Which identities were involved?</text>

    <rect x="276" y="478" width="254" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="292" y="508" font-size="13" fill="#7f1d1d">Was there an approved change?</text>
  </g>

  <g>
    <rect x="640" y="104" width="240" height="40" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="656" y="129" font-size="12.5" fill="#334155">process-lineage</text>

    <rect x="640" y="162" width="240" height="40" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="656" y="187" font-size="12.5" fill="#334155">scheduled-tasks-by-host</text>

    <rect x="640" y="220" width="240" height="40" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="656" y="245" font-size="12.5" fill="#334155">service-installs-by-host</text>

    <rect x="640" y="278" width="240" height="40" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
    <text x="656" y="303" font-size="12.5" font-weight="600" fill="#3730a3">process-prevalence-in-estate</text>

    <rect x="640" y="336" width="240" height="40" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="656" y="361" font-size="12.5" fill="#334155">process-network-connections</text>

    <rect x="640" y="394" width="240" height="40" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
    <text x="656" y="419" font-size="12.5" font-weight="600" fill="#3730a3">dns-lookups-by-host</text>

    <rect x="640" y="452" width="240" height="40" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="656" y="477" font-size="12.5" fill="#334155">auth-events-by-user</text>
  </g>

  <rect x="632" y="510" width="256" height="40" rx="7" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="648" y="535" font-size="12.5" fill="#7f1d1d">no query yet — a gap worth filling</text>

  <line x1="30" y1="578" x2="910" y2="578" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="30" y="600" font-size="12.5" fill="#5b6673">One question usually needs several queries, and one query serves several questions across several playbooks.</text>
  <text x="30" y="622" font-size="12.5" fill="#5b6673">Highlighted queries answer more than one question. Dashed red: a question with no query behind it yet.</text>
</svg>
