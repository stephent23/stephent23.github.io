<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#64748b"/></marker>
</defs>
<rect width="960" height="650" fill="#ffffff"/>
<text x="44" y="46" font-size="24" font-weight="700" fill="#0f172a">A loose architecture for the AI-ready SOC</text>
<text x="44" y="72" font-size="14" fill="#64748b">Reasoning and access are the new layers. Everything else exists in some form already.</text>
<rect x="44" y="96" width="872" height="52" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="64" y="119" font-size="15" font-weight="700" fill="#92400e">Analysts</text>
<text x="64" y="137" font-size="13" fill="#78350f">Direct the work, review conclusions, own decisions, investigate the novel, lead the response</text>
<rect x="44" y="196" width="250" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="64" y="226" font-size="15" font-weight="700" fill="#0f172a">Incident management</text>
<text x="64" y="250" font-size="13" fill="#475569">SOAR or case system</text>
<text x="64" y="268" font-size="13" fill="#475569">Cases, evidence, decisions</text>
<rect x="355" y="196" width="250" height="112" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
<text x="375" y="226" font-size="15" font-weight="700" fill="#0c4a6e">Reasoning</text>
<text x="375" y="250" font-size="13" fill="#334155">Models and orchestration</text>
<text x="375" y="268" font-size="13" fill="#334155">Pivots on playbook questions</text>
<text x="589" y="226" font-size="11" font-weight="700" fill="#0284c7" text-anchor="end">NEW</text>
<rect x="666" y="196" width="250" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="686" y="226" font-size="15" font-weight="700" fill="#0f172a">Knowledge base</text>
<text x="686" y="250" font-size="13" fill="#475569">Playbooks, queries, skills,</text>
<text x="686" y="268" font-size="13" fill="#475569">detections, in Git</text>
