<line x1="791" y1="150" x2="791" y2="194" stroke="#64748b" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="779" y="176" font-size="11.5" fill="#64748b" text-anchor="end">corrections as pull requests</text>
<rect x="44" y="356" width="872" height="100" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
<text x="64" y="384" font-size="15" font-weight="700" fill="#0c4a6e">Access: MCP servers</text>
<text x="896" y="384" font-size="11" font-weight="700" fill="#0284c7" text-anchor="end">NEW</text>
<text x="64" y="404" font-size="13" fill="#334155">One door to every platform: vendor servers or thin internal wrappers. Skills hold no credentials.</text>
